name: CI Pipeline

on:
  pull_request:
    branches: [ main, master, develop ]
  push:
    branches: [ main, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -------------------------------------------------------------
  # Job 1: Backend Checks (Lint, Typecheck, DB Migrations, Unit & API Tests)
  # -------------------------------------------------------------
  backend-ci:
    name: Backend CI (Build, DB, Unit & API Tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg://test_user:test_password@localhost:5432/test_db
      APP_ENV: testing
      COOKIE_SECURE: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: uv sync --all-groups

      - name: Code Quality & Linting (Ruff)
        run: uv run ruff check .

      - name: Static Type Check (Mypy)
        run: uv run mypy app

      - name: Apply Database Migrations (Alembic)
        run: uv run alembic upgrade head

      - name: Run Unit & API Tests (Pytest)
        run: uv run pytest -v --tb=short

  # -------------------------------------------------------------
  # Job 2: Frontend Checks (Lint, Typecheck, Build)
  # -------------------------------------------------------------
  frontend-ci:
    name: Frontend CI (Lint, Typecheck, Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format & Lint Check
        run: |
          pnpm format:check
          pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build Frontend
        run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: 1

